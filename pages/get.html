<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <meta charset="UTF-8" />
    <title>Destinos</title>
    <link rel="stylesheet" href="../CSS/get.css" />
    <script src="../js/get.js" defer></script>

  </head>

  <body>
    <header>
      <h1>Lista de destinos</h1>
      <p>Veja abaixo a lista de destinos</p>
    </header>
    <main>
      <p><a href="../index.html">Voltar para o cadastro</a></p>
      <section id="container-titulo-lista">
        <h2 id="titulo-lista">Destinos cadastrados</h2>
        <p>Os destinos são exibidos automaticamente ao abrir a página</p>
        <p id="resposta"></p>
        <ul id="lista-destinos"></ul>
      </section>
    </main>

    <template id="modelo-destino">
        <li>
            <section class="card-capa">
                <img class="imagem-destino" src="" alt="">
            </section>
            <section class="card-conteudo">
                <h3 class="nome"></h3>
                <p><strong>Tipo de destino: </strong><span class="tipo_destino"></span></p>
                <p><strong>Melhor época: </strong><span class="melhor_epoca"></span></p>
                <p><strong>Custo médio: </strong><span class="custo-medio"></span></p>
            </section>
        </li>
    </template>
  </body>
</html>
