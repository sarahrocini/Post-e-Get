<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <meta charset="UTF-8" />
    <title>Cadastro de Destinos</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <script src="./js/post.js" defer></script>

  </head>

<body>
    <header>
        <h1>Cadastro de Destinos</h1>
        <p>Preencha os dados abaixo para cadastrar um novo destino:</p>
    </header>
    <main>
    <section>
        <p><a href="./pages/get.html">Consultar destinos</a></p>
        <h2>Novo Destino</h2>

        <form id="form-destino">
          <label for="title">Nome do Destino (país): </label>
          <input id="title" name="title" type="text" minlength="3" maxlength="120" required />

          <label for="tipo_destino">Tipo de destino (ex: Praia, Montanha, Cidade): </label>
          <input id="tipo_destino" name="tipo_destino" type="text" required />

          <label for="melhor_epoca">Melhor época: </label>
          <input id="melhor_epoca" name="melhor_epoca" type="text" required />

          <label for="custo_medio">Custo médio: </label>
          <input id="custo_medio" name="custo_medio" type="number" step="0.01" required />

          <label for="imageUrl">URL da imagem (opcional): </label>
          <input id="imageUrl" name="imageUrl" type="url" />

          <button type="submit">Cadastrar destino</button>
        </form>

        <p id="resposta"></p>
      </section>
    </main>

</body>
</html>
